name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Compile Feather
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          make
          mkdir upload
          mv packages/* upload/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lopfinder-build-${{ github.run_number }}
          path: upload/*
          if-no-files-found: error

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(awk -F= '/^FEATHER_PROJECT_VERSION[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' Feather.xcconfig)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lopfinder v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            upload/*
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
